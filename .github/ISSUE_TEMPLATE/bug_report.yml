name: Bug report
description: Reporte um problema de funcionamento do CastDeck
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar. **Não inclua chaves de stream, dados pessoais, gravações ou informações da VPS.**
        Para vulnerabilidades, use o canal privado descrito em SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado e o esperado.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: "1. Abra...\n2. Clique...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão do CastDeck
      placeholder: "1.3.26"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema
      options:
        - Windows
        - Linux
        - macOS
        - Android
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes (sem segredos)
      render: shell
  - type: checkboxes
    id: safe
    attributes:
      label: Confirmação
      options:
        - label: Removi chaves, dados pessoais e informações sensíveis do relato.
          required: true
