# Assinatura do executável Windows pelo SignPath Foundation (gratuito para OSS).
#
# Requisitos atendidos por este workflow:
#   - build em runner hospedado pelo GitHub (SignPath exige para projetos OSS);
#   - artefato publicado como artifact ANTES de pedir a assinatura (verificação de origem);
#   - aprovação manual no SignPath antes de assinar.
#
# Variáveis/secrets necessários (Settings → Secrets and variables → Actions):
#   vars.SIGNPATH_ORGANIZATION_ID     (ex.: 00000000-0000-0000-0000-000000000000)
#   vars.SIGNPATH_PROJECT_SLUG        (ex.: castdeck)
#   vars.SIGNPATH_POLICY_SLUG         (ex.: release-signing)
#   vars.SIGNPATH_ARTIFACT_CONFIG     (ex.: castdeck-exe)
#   secrets.SIGNPATH_API_TOKEN        (token de usuário com permissão de submitter)
#
# Enquanto as variáveis não existirem o job "assinar" é pulado (o build continua verde).
name: sign-windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da release para anexar o binário assinado (ex.: v1.8.25). Vazio = só artifact.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write # anexar o binário assinado à release
  actions: read

jobs:
  build:
    name: Build CastDeck.exe
    runs-on: windows-2022
    outputs:
      versao: ${{ steps.versao.outputs.valor }}
      artefato_id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Versão
        id: versao
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "valor=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Dependências
        run: npm ci --omit=optional

      - name: Compilar executável
        run: npm run build:exe

      - name: Conferir metadados do binário
        run: node test/binary-meta.test.mjs

      - name: Enviar artefato para a assinatura
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: CastDeck-unsigned
          path: dist/CastDeck.exe
          archive: false
          retention-days: 1

  sign:
    name: Assinar (SignPath Foundation)
    needs: build
    runs-on: windows-2022
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CastDeck-unsigned
          path: unsigned

      - name: Submeter ao SignPath
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ needs.build.outputs.artefato_id }}
          wait-for-completion: true
          output-artifact-directory: signed
          skip-decompress: true
          parameters: |
            version: "${{ needs.build.outputs.versao }}"

      - name: Conferir assinatura
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path signed -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'binário assinado não encontrado' }
          $s = Get-AuthenticodeSignature $exe.FullName
          "status: $($s.Status)"
          "editor: $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { throw "assinatura inválida: $($s.Status)" }

      - name: Publicar binário assinado
        uses: actions/upload-artifact@v4
        with:
          name: CastDeck-signed
          path: signed/*.exe
          retention-days: 30

      - name: Anexar na release (quando houver tag)
        if: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ('${{ inputs.release_tag }}') { '${{ inputs.release_tag }}' } else { '${{ github.ref_name }}' }
          $exe = Get-ChildItem -Path signed -Filter *.exe -Recurse | Select-Object -First 1
          if ($exe) { gh release upload $tag $exe.FullName --clobber }
