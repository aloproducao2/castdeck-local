[package]
name = "castdeck-sherpa"
version = "1.2.71"
description = "CastDeck Local - worker de legenda ao vivo streaming (sherpa-onnx Kroko pt-BR)"
authors = ["Miguel Kallemback <miguel@flue.live>"]
license = "AGPL-3.0-only"
edition = "2021"

[dependencies]
serde_json = "1"
sherpa-onnx = "1.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
