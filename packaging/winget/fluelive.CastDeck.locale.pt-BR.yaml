ShortDescription: Estúdio de transmissão ao vivo 100% local, com convidados, cenas e multistream.
Description: |-
  CastDeck Local é um estúdio de transmissão ao vivo que roda no seu próprio PC: chamadas de vídeo com
  convidados, composição de cenas com sua marca, gráficos (GC), jornal, replay e multistream para várias
  plataformas ao mesmo tempo (RTMP/SRT) via FFmpeg embutido. Não depende de servidor na nuvem: a mídia
  não sai da sua máquina exceto para as plataformas que você configurar.
