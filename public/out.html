  <meta name="description" content="Sinal limpo do estúdio CastDeck para usar como fonte de navegador no OBS ou vMix.">
  <script src="/js/i18n.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body.transparent { background: transparent; }
    video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: transparent; }
    body.fill video { object-fit: cover; }
    .status { position: fixed; inset: 0; display: grid; place-items: center; color: #b9b6cc; font: 600 18px/1.4 system-ui, "Segoe UI", sans-serif; text-align: center; padding: 24px; pointer-events: none; }
    .status b { display: block; color: #fff; font-size: 22px; margin-bottom: 4px; }
    .status[hidden] { display: none; }
    .unmute { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 18px; border-radius: 99px; border: 0; background: #7b5cf0; color: #fff; font: 700 15px system-ui, sans-serif; cursor: pointer; }
    .unmute[hidden] { display: none; }
  </style>
</head>
<body>
  <h1 hidden>Sinal do estúdio CastDeck</h1>
  <video id="out-video" autoplay playsinline></video>
  <div class="status" id="out-status"><div><b>CastDeck</b><span id="out-msg">Conectando ao estúdio…</span></div></div>
  <button class="unmute" id="out-unmute" hidden>🔊 <span>Ativar som</span></button>
  <script type="module" src="/js/out.js"></script>
</body>
