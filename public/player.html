<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Player WebRTC · CastDeck</title>
  <script src="/js/i18n.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #07080d; color: #f1f3f9; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
    .stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .hud { position: fixed; top: 14px; left: 14px; right: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; pointer-events: none; transition: opacity .25s; z-index: 10; }
    .hud > * { pointer-events: auto; }
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: rgba(14, 16, 24, .82); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(10px); font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
    .dot.live { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .dot.wait { background: #f59e0b; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; }
    button { appearance: none; border: 1px solid rgba(255,255,255,.16); background: rgba(18, 20, 30, .86); color: #f1f3f9; padding: 7px 11px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; backdrop-filter: blur(10px); }
    button:hover { background: rgba(99, 102, 241, .28); border-color: rgba(129, 140, 248, .55); }
    button.primary { background: #6366f1; border-color: #6366f1; }
    .center-msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; pointer-events: none; text-align: center; padding: 24px; }
    .center-msg[hidden] { display: none; }
    .center-msg .box { pointer-events: auto; background: rgba(14, 16, 24, .9); border: 1px solid rgba(255,255,255,.14); padding: 18px 22px; border-radius: 14px; max-width: 440px; }
    .center-msg h2 { margin: 0 0 6px; font-size: 16px; }
    .center-msg p { margin: 0; font-size: 13px; color: #a1a7b8; }
    .unmute { position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); z-index: 12; }
    .unmute[hidden] { display: none; }
    .toast { position: fixed; bottom: 18px; right: 18px; padding: 8px 14px; border-radius: 8px; background: #1e293b; border: 1px solid rgba(255,255,255,.15); font-size: 12px; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="stage">
    <video id="v" autoplay playsinline controls muted></video>
  </div>
  <div class="hud" id="hud">
    <div class="pill">
      <span class="dot wait" id="dot"></span>
      <strong id="title">CastDeck Player</strong>
      <span id="status" style="color:#a1a7b8">Conectando via WebRTC…</span>
    </div>
    <div class="actions">
      <button id="copy-rtmp" hidden>Copiar RTMP</button>
      <button id="copy-srt" hidden>Copiar SRT</button>
      <button id="copy-rtsp" hidden>Copiar RTSP</button>
      <button id="btn-fs">Tela cheia</button>
    </div>
  </div>
  <button class="primary unmute" id="btn-unmute" hidden>🔊 Clique para ativar o áudio</button>
  <div class="center-msg" id="wait-box" hidden>
    <div class="box">
      <h2 id="wait-title">Aguardando sinal…</h2>
      <p id="wait-sub">O player conecta automaticamente assim que o fluxo ficar ativo no CastDeck.</p>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script type="module" src="/js/player.js"></script>
</body>
</html>
