<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="/icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a12">
  <meta name="robots" content="noindex">
  <title>Painel Destacado — CastDeck</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-0, #0a0a12);
      color: var(--text-0, #f3f0ff);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    .pop-root {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-1, #12101e);
    }
    .pop-head {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: linear-gradient(180deg, var(--bg-3, #252038), var(--bg-2, #1a1728));
      border-bottom: 1px solid var(--line, rgba(255, 255, 255, 0.1));
    }
    .pop-title {
      flex: 1;
      font-size: 13.5px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pop-btn {
      height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 10px;
      border-radius: 7px;
      border: 1px solid var(--line, rgba(255, 255, 255, 0.12));
      background: var(--bg-3, #252038);
      color: var(--text-1, #b5b0d0);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .pop-btn:hover {
      background: var(--bg-4, #332d4d);
      color: var(--text-0, #ffffff);
    }
    .pop-btn.active {
      background: hsl(38 80% 30% / .65) !important;
      border-color: hsl(38 90% 56%) !important;
      color: #fff !important;
    }
    .pop-btn.pop-close:hover {
      background: var(--live, #ef4444) !important;
      border-color: var(--live, #ef4444) !important;
      color: #fff !important;
    }
    .pop-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
    .pop-body .panel {
      display: flex !important;
      flex-direction: column;
      width: 100%;
      height: 100%;
      max-height: none;
      padding: 0;
    }
    .pop-body #panel-director,
    .pop-body #panel-audio {
      display: block !important;
    }
    .pop-body #panel-whatsapp {
      display: block !important;
      overflow-y: auto;
      padding: 12px;
    }
    .pip-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      gap: 12px;
      color: var(--text-1);
      flex: 1;
    }
  </style>
</head>
<body class="theme-dark">
  <div class="pop-root">
    <header class="pop-head">
      <div class="pop-title" id="pop-title">
        <span id="pop-title-text">Painel</span>
      </div>
      <button class="pop-btn" id="pop-pin" title="Sempre no topo: fixa a janela sobre todos os outros programas (Picture-in-Picture nativo)">
        <span>📌</span>
        <span id="pop-pin-lbl">Fixar no topo</span>
      </button>
      <button class="pop-btn pop-close" id="pop-close" title="Fechar e devolver para a lateral do estúdio">
        <span>✕</span>
        <span>Fechar</span>
      </button>
    </header>
    <main class="pop-body" id="pop-body"></main>
  </div>

  <script type="module">
    const params = new URLSearchParams(window.location.search);
    const tab = params.get('tab') || 'director';

    const LABELS = {
      director: 'Diretor Automático',
      audio: 'Mixer de Áudio',
      social: 'Redes Sociais',
      chat: 'Chat do Estúdio',
      messages: 'Mensagens do Público',
      whatsapp: 'WhatsApp',
      widgets: 'Enquetes e QR Code',
      media: 'Mídia e Vídeos',
      banners: 'Banners e GCs',
      journal: 'GC de Telejornal',
      sports: 'Placar Esportivo',
      brand: 'Identidade Visual',
      display: 'Exibição de Nomes',
      output: 'Transmissão e Destinos',
      devices: 'Dispositivos e Câmeras',
      outputs: 'Sinais OBS/vMix'
    };

    const titleText = LABELS[tab] || (tab.charAt(0).toUpperCase() + tab.slice(1));
    document.title = `${titleText} — CastDeck`;
    document.getElementById('pop-title-text').textContent = titleText;

    const studio = window.opener;
    const bodyEl = document.getElementById('pop-body');
    const pinBtn = document.getElementById('pop-pin');
    const closeBtn = document.getElementById('pop-close');

    let panel = null;
    let pipWin = null;
    let docked = false;
    let rafId = null;

    function init() {
      if (!studio || studio.closed) {
        bodyEl.innerHTML = '<div class="pip-placeholder"><b>Estúdio não conectado.</b><p style="font-size:12px">Abra este painel a partir do estúdio principal do CastDeck.</p></div>';
        return;
      }

      panel = studio.document.getElementById('panel-' + tab);
      if (panel) {
        bodyEl.appendChild(panel);
        panel.classList.add('active', 'fw-panel');
        studio.__castdeck?.registerPopout?.(tab, window, panel);
        studio.__castdeck?.renderTab?.(tab);
        startPopoutLoop();
      } else {
        setTimeout(init, 200);
      }
    }

    function startPopoutLoop() {
      if (rafId) cancelAnimationFrame(rafId);
      const loop = () => {
        try {
          if (!studio || studio.closed) return;
          if (tab === 'audio') {
            studio.__castdeck?.audioPanel?.tick?.();
          }
        } catch {}
        rafId = requestAnimationFrame(loop);
      };
      rafId = requestAnimationFrame(loop);
    }

    function dock() {
      if (docked) return;
      docked = true;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      try {
        if (pipWin) {
          pipWin.close();
          pipWin = null;
        }
      } catch {}

      if (studio && !studio.closed) {
        studio.__castdeck?.unregisterPopout?.(tab);
        if (panel) {
          try {
            panel.classList.remove('fw-panel', 'active');
            const sideBody = studio.document.getElementById('side-body');
            if (sideBody) {
              sideBody.appendChild(panel);
            }
            studio.__castdeck?.onDock?.(tab);
          } catch (e) {
            console.warn('Erro ao devolver painel:', e);
          }
        }
      }

      window.close();
    }

    closeBtn.onclick = dock;
    window.addEventListener('beforeunload', dock);
    window.addEventListener('pagehide', dock);

    // Botão de Fixar no Topo (Always-on-Top real do sistema via Document Picture-in-Picture)
    pinBtn.onclick = async () => {
      if (pipWin) {
        pipWin.close();
        pipWin = null;
        updatePinUi(false);
        return;
      }

      if ('documentPictureInPicture' in window) {
        try {
          pipWin = await window.documentPictureInPicture.requestWindow({
            width: Math.min(window.outerWidth || 500, 850),
            height: Math.min(window.outerHeight || 700, 950),
          });

          // Copia estilos para a janela PiP
          for (const s of document.querySelectorAll('link[rel="stylesheet"], style')) {
            pipWin.document.head.appendChild(s.cloneNode(true));
          }

          pipWin.document.title = `${titleText} (No Topo) — CastDeck`;
          pipWin.document.body.className = document.body.className;

          const popRoot = document.querySelector('.pop-root');
          const ph = document.createElement('div');
          ph.className = 'pip-placeholder';
          ph.innerHTML = `<b>${titleText} fixado no topo 📌</b><p style="font-size:12px;margin:0">O painel está sempre visível acima de todas as outras janelas do seu computador.</p><button class="pop-btn" id="btn-return-pip" style="margin-top:8px"><span>↩</span> Trazer de volta</button>`;

          popRoot.parentNode.insertBefore(ph, popRoot);
          pipWin.document.body.appendChild(popRoot);

          updatePinUi(true);

          const returnFromPip = () => {
            if (!pipWin) return;
            ph.parentNode.insertBefore(popRoot, ph);
            ph.remove();
            pipWin = null;
            updatePinUi(false);
          };

          pipWin.addEventListener('pagehide', returnFromPip);
          pipWin.document.getElementById('pop-pin').onclick = () => pipWin.close();
          pipWin.document.getElementById('pop-close').onclick = () => {
            pipWin.close();
            dock();
          };
          ph.querySelector('#btn-return-pip').onclick = () => pipWin.close();
          return;
        } catch (err) {
          console.warn('Falha ao abrir Document PiP:', err);
        }
      }

      // Fallback
      alert('Seu navegador não suporta Document Picture-in-Picture nativo. Use o Microsoft Edge ou Google Chrome.');
    };

    function updatePinUi(on) {
      pinBtn.classList.toggle('active', on);
      pinBtn.setAttribute('aria-pressed', String(on));
      const lbl = document.getElementById('pop-pin-lbl');
      if (lbl) lbl.textContent = on ? 'Fixado no topo 📌' : 'Fixar no topo';
      const pipPin = pipWin?.document.getElementById('pop-pin');
      if (pipPin) {
        pipPin.classList.toggle('active', on);
        pipPin.setAttribute('aria-pressed', String(on));
      }
    }

    // Janela destacada: garante foco no primeiro clique (sem precisar clicar duas vezes para ir ao ar).
    try { window.focus(); } catch {}
    document.addEventListener('pointerdown', () => { try { window.focus(); } catch {} }, true);
    init();
  </script>
</body>
</html>
