  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="/icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Projetor — CastDeck Local</title>
  <meta name="description" content="Projetor do CastDeck: o programa em tela cheia num monitor, TV ou saída HDMI.">
  <script src="/js/i18n.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff; font: 500 14px/1.4 Inter, system-ui, "Segoe UI", sans-serif; user-select: none; }
    body.idle, body.idle * { cursor: none !important; }
    video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
    .status { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #b9b6cc; font-size: 18px; pointer-events: none; }
    .status b { display: block; color: #fff; font-size: 24px; margin-bottom: 6px; letter-spacing: -.01em; }
    [hidden] { display: none !important; }
    .bar { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 14px; background: hsl(240 16% 10% / .82); border: 1px solid hsl(240 10% 30% / .7); backdrop-filter: blur(12px); box-shadow: 0 16px 40px -12px #000; transition: opacity .25s, transform .25s; z-index: 5; }
    body.idle .bar { opacity: 0; transform: translate(-50%, -12px); pointer-events: none; }
    .tag { padding: 4px 10px; border-radius: 9px; background: hsl(354 85% 57%); font-weight: 800; font-size: 12px; letter-spacing: .06em; }
    .tag.pvw { background: hsl(150 65% 40%); }
    .tag.v { background: hsl(258 90% 62%); }
    .bar button, .bar select { height: 34px; border: 1px solid hsl(240 10% 30%); background: hsl(240 12% 18%); color: #fff; border-radius: 9px; padding: 0 12px; font: 600 13px Inter, system-ui, sans-serif; cursor: pointer; }
    .bar button:hover, .bar select:hover { background: hsl(240 10% 24%); }
    .bar button.on { background: hsl(258 90% 62%); border-color: transparent; }
    .bar select { max-width: 220px; }
    .hint { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 10px 18px; border-radius: 99px; background: hsl(240 16% 10% / .85); border: 1px solid hsl(240 10% 30% / .7); font-size: 14px; transition: opacity .4s; z-index: 5; }
    body.idle .hint { opacity: 0; }
  </style>
</head>
<body>
  <h1 hidden>Projetor do CastDeck</h1>
  <video id="pj-video" autoplay playsinline muted></video>
  <div class="status" id="pj-status"><div><b>CastDeck</b><span id="pj-msg">Aguardando o sinal do estúdio…</span></div></div>
  <div class="bar" id="pj-bar">
    <span class="tag" id="pj-tag">PGM</span>
    <button id="pj-fs" title="Tela cheia (F ou duplo clique)">Tela cheia</button>
    <button id="pj-audio" title="Tocar o áudio do programa nesta saída (ex.: som da TV pelo HDMI)">Som desligado</button>
    <select id="pj-sink" title="Saída de áudio" hidden></select>
    <button id="pj-close" title="Fechar o projetor (Esc fora da tela cheia)">Fechar</button>
  </div>
  <div class="hint" id="pj-hint" hidden>Duplo clique ou F para tela cheia</div>
  <script type="module" src="/js/projector.js"></script>
</body>
</html>
