<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="/icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d0b17">
  <title>Controle remoto — CastDeck</title>
  <meta name="description" content="Controle remoto do estúdio CastDeck: mesa de corte completa pelo celular, sem enviar câmera nem microfone.">
  <style>
    :root {
      --bg:#07080e; --panel:#0f121d; --panel2:#171b2b; --line:#242a42; --line-subtle:#1b2033;
      --txt:#f4f5fb; --mut:#949bb8; --acc:#7c5cff; --acc-glow:#7c5cff55;
      --pgm:#ef4444; --pvw:#10b981; --amb:#f59e0b; --cyan:#00d2ff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font: 500 15px/1.35 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
    body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); background: radial-gradient(circle at 50% 0%, #121629 0%, var(--bg) 70%); }
    :fullscreen { background: var(--bg); }
    button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
    
    /* Header */
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: linear-gradient(180deg,#141828,#0b0d16e6); border-bottom: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.05); z-index: 10; }
    header h1 { flex: 1; margin: 0; font-size: 15px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header h1 small { display: block; font-size: 11px; font-weight: 600; color: var(--mut); }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; box-shadow: 0 0 0 3px #6663; flex: none; }
    .dot.on { background: var(--pvw); box-shadow: 0 0 0 3px #27d17f33; }
    .dot.wait { background: var(--amb); box-shadow: 0 0 0 3px #ffb02033; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .badge { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 99px; letter-spacing: .06em; flex: none; }
    .badge.live { background: var(--pgm); color: #fff; }
    .badge.rec { background: #3a2f66; color: #ffd0d8; }
    .hdr-actions { display: flex; align-items: center; gap: 6px; }
    .iconbtn { width: 38px; height: 38px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); font-size: 17px; display: inline-flex; align-items: center; justify-content: center; }
    .iconbtn:active { transform: scale(.95); }
    .iconbtn.on { background: var(--acc); border-color: var(--acc); color: #fff; }
    
    /* Main container */
    main { flex: 1; overflow-y: auto; padding: 12px 12px 145px; -webkit-overflow-scrolling: touch; }
    body.no-media main { padding-bottom: 85px; }
    .tab { display: none; }
    .tab.active { display: block; animation: fadeIn .18s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Bottom Navigation */
    nav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5,1fr); gap: 4px; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: #100d1dee; backdrop-filter: blur(14px); border-top: 1px solid var(--line); z-index: 20; }
    nav button { position: relative; padding: 7px 0 5px; border-radius: 12px; background: transparent; color: var(--mut); font-size: 11px; font-weight: 700; display: grid; gap: 2px; justify-items: center; }
    nav button b { font-size: 18px; line-height: 1; }
    nav button.active { background: var(--panel2); color: #fff; box-shadow: inset 0 0 0 1px var(--acc); }
    .badge-dot { position: absolute; top: 5px; right: calc(50% - 14px); width: 8px; height: 8px; border-radius: 50%; background: var(--pgm); box-shadow: 0 0 6px var(--pgm); }

    /* Persistent Music-App Style Mini Player at Bottom */
    .mini-player {
      position: fixed; left: 10px; right: 10px; bottom: calc(58px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, hsl(262 45% 18% / .96), hsl(250 35% 12% / .98));
      backdrop-filter: blur(16px);
      border: 1px solid hsl(262 60% 40% / .5);
      box-shadow: 0 8px 24px rgba(0,0,0,.6), 0 0 0 1px hsl(262 70% 60% / .2) inset;
      border-radius: 14px;
      overflow: hidden;
      z-index: 19;
      transition: transform .2s ease, opacity .2s ease;
    }
    .mini-player[hidden] { display: none; }
    .mp-bar { position: relative; width: 100%; height: 5px; background: hsl(250 25% 18%); cursor: pointer; }
    .mp-fill { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--acc), var(--cyan)); border-radius: 0 2px 2px 0; transition: width .15s linear; }
    .mp-main { display: flex; align-items: center; gap: 8px; padding: 7px 10px 8px; min-width: 0; }
    .mp-ico { width: 34px; height: 34px; border-radius: 10px; background: hsl(260 40% 22%); display: grid; place-items: center; font-size: 16px; flex: none; border: 1px solid var(--line); }
    .mini-player.playing .mp-ico { background: linear-gradient(135deg, hsl(262 60% 45%), hsl(190 70% 45%)); color: #fff; animation: pulseIco 1.5s ease-in-out infinite alternate; }
    @keyframes pulseIco { from { transform: scale(1); } to { transform: scale(1.05); } }
    .mp-info { flex: 1; min-width: 0; display: grid; gap: 1px; }
    .mp-info b { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--txt); }
    .mp-info small { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--mut); font-weight: 600; }
    .mp-ctrls { display: flex; align-items: center; gap: 5px; flex: none; }
    .mp-btn { width: 32px; height: 32px; border-radius: 10px; background: hsl(250 25% 20%); display: grid; place-items: center; font-size: 14px; font-weight: 800; }
    .mp-btn:active { transform: scale(.92); }
    .mp-play { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--acc), #6c4ae0); color: #fff; font-size: 16px; box-shadow: 0 4px 12px var(--acc-glow); }
    .mp-stage { font-size: 11px; font-weight: 800; padding: 0 9px; height: 32px; border-radius: 10px; background: hsl(250 25% 20%); }
    .mp-stage.on { background: hsl(150 65% 36%); color: #fff; box-shadow: 0 0 10px hsl(150 65% 46% / .4); }

    /* Typography & Sections */
    h2 { margin: 16px 2px 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--mut); display: flex; align-items: center; justify-content: space-between; }
    
    /* Program Screen */
    .screen { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 16/9; border: 2px solid var(--pgm); box-shadow: 0 0 22px #ff3b5733; }
    .screen img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .screen .tag { position: absolute; left: 8px; top: 8px; background: var(--pgm); font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 6px; }
    .screen.off { aspect-ratio: auto; display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--panel); box-shadow: none; }
    .screen.off .tag { position: static; }

    /* Switcher Bus & Transitions */
    .bus { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .busbox { padding: 8px 10px; border-radius: 12px; background: var(--panel); border: 1.5px solid var(--line); font-size: 12px; color: var(--mut); min-width: 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
    .busbox b { display: block; color: var(--txt); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .busbox.pgm { border-color: var(--pgm); background: linear-gradient(180deg, #2b1219, #1d0c11); box-shadow: 0 0 16px -4px #ef444444, inset 0 1px 0 rgba(255,255,255,.08); }
    .busbox.pvw { border-color: var(--pvw); background: linear-gradient(180deg, #0d261b, #091912); box-shadow: 0 0 16px -4px #10b98144, inset 0 1px 0 rgba(255,255,255,.08); }
    .trans { display: grid; grid-template-columns: 1.2fr 1.2fr .8fr; gap: 8px; margin-top: 10px; }
    .trans button { height: 56px; border-radius: 14px; font-weight: 900; font-size: 16px; letter-spacing: .06em; background: var(--panel2); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }
    .trans .cut { background: linear-gradient(180deg,#f43f5e,#dc2626); border-color: #fb7185; box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 8px 20px -4px #ef444466; color: #fff; }
    .trans .auto { background: linear-gradient(180deg,#8b5cf6,#6d28d9); border-color: #a78bfa; box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 8px 20px -4px #7c5cff66; color: #fff; }
    .trans .ftb.on { background: #000; box-shadow: inset 0 0 0 2px var(--amb); color: var(--amb); }
    .trans button:active { transform: scale(.97); }

    /* Source Grid */
    .grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
    .src { position: relative; min-height: 64px; padding: 10px 10px 10px 12px; border-radius: 14px; background: linear-gradient(180deg, var(--panel2), var(--panel)); text-align: left; border: 1.5px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.05); display: grid; gap: 2px; align-content: center; min-width: 0; }
    .src b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .src small { color: var(--mut); font-size: 11px; font-weight: 600; }
    .src.pgm { border-color: var(--pgm); background: linear-gradient(180deg, #3b151e, #240d13); box-shadow: 0 0 18px -4px #ef444455, inset 0 1px 0 rgba(255,255,255,.1); }
    .src.pvw { border-color: var(--pvw); background: linear-gradient(180deg, #103322, #0a2016); box-shadow: 0 0 18px -4px #10b98155, inset 0 1px 0 rgba(255,255,255,.1); }
    .src .pill { position: absolute; right: 8px; top: 8px; font-size: 10px; font-weight: 900; padding: 1px 6px; border-radius: 99px; }
    .src.pgm .pill { background: var(--pgm); color: #fff; }
    .src.pvw .pill { background: var(--pvw); color: #04210f; }
    .src.on .pill { background: var(--acc); color: #fff; }
    .src.muted { opacity: .65; }

    /* Layouts Grid */
    .lay { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .lay button { padding: 8px 6px 6px; border-radius: 12px; background: var(--panel); border: 2px solid var(--line); display: grid; gap: 4px; justify-items: center; font-size: 11px; color: var(--mut); }
    .lay button svg { width: 100%; height: 38px; fill: #6d66a0; stroke: none; }
    .lay button.active { border-color: var(--acc); color: #fff; background: #241d4a; }
    .lay button.active svg { fill: var(--acc); }

    /* Rows, Switches & Buttons */
    .row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 14px; background: var(--panel); border: 2px solid var(--line); margin-bottom: 8px; width: 100%; text-align: left; }
    .row > span { flex: 1; min-width: 0; }
    .row b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
    .row small { color: var(--mut); font-size: 12px; font-weight: 600; }
    .row.on { border-color: var(--acc); }
    .row.air { border-color: var(--pgm); background: #3a1620; }
    .sw { width: 46px; height: 26px; border-radius: 99px; background: #3a3560; position: relative; flex: none; transition: background .15s; }
    .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .row.on .sw { background: var(--acc); }
    .row.on .sw::after { transform: translateX(20px); }
    .row.bad .sw { background: var(--pgm); }
    .row.bad .sw::after { transform: translateX(20px); }
    .mini { display: flex; gap: 6px; }
    .mini button { padding: 8px 12px; border-radius: 10px; background: var(--panel2); font-weight: 800; font-size: 13px; }
    .mini button.on { background: var(--acc); color: #fff; }
    
    .btn { padding: 12px 16px; border-radius: 12px; background: var(--acc); font-weight: 800; }
    .btn.ghost { background: var(--panel2); border: 1px solid var(--line); }
    .btn.danger { background: var(--pgm); color: #fff; }
    .btn.sm { padding: 8px 12px; font-size: 12px; border-radius: 10px; }
    .note { padding: 14px; border-radius: 14px; background: var(--panel); border: 1px dashed var(--line); color: var(--mut); text-align: center; margin: 10px 0; }
    .note button { margin-top: 8px; }

    /* Inputs */
    input[type=text], textarea { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); color: var(--txt); font: inherit; margin-bottom: 8px; }
    input[type=text]:focus, textarea:focus { border-color: var(--acc); outline: none; }
    
    /* Messages & Chat Tab */
    .chat-box { display: flex; flex-direction: column; gap: 8px; min-height: 200px; max-height: 50vh; overflow-y: auto; padding: 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 10px; }
    .chat-empty { text-align: center; color: var(--mut); padding: 30px 10px; font-size: 13px; }
    .chat-msg { display: grid; gap: 3px; padding: 8px 10px; border-radius: 10px; background: var(--panel2); border-left: 3px solid var(--acc); }
    .chat-msg.host { border-left-color: var(--cyan); }
    .chat-msg.remote { border-left-color: var(--pvw); }
    .chat-hdr { display: flex; align-items: center; justify-content: space-between; font-size: 11px; }
    .chat-hdr b { color: var(--txt); font-weight: 700; }
    .chat-hdr small { color: var(--mut); }
    .chat-text { font-size: 13.5px; line-height: 1.35; color: #ede9fe; word-break: break-word; }
    .chat-act { margin-top: 4px; display: flex; justify-content: flex-end; }
    .chat-act button { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: hsl(262 50% 25%); color: #d8b4fe; }
    .chat-form { display: flex; gap: 6px; margin-bottom: 16px; }
    .chat-form input { margin-bottom: 0; }
    .chat-form button { flex: none; }

    /* Sliders & Volume */
    .vol-box { display: flex; flex-direction: column; gap: 4px; width: 100%; margin-top: 6px; }
    .vol-bar { display: flex; align-items: center; gap: 8px; }
    .vol-bar input[type=range] { flex: 1; accent-color: var(--acc); height: 8px; border-radius: 4px; background: #262142; margin: 0; cursor: pointer; }
    .vol-bar span { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--mut); min-width: 34px; text-align: right; }
    .master-box { background: linear-gradient(180deg, #241c45, #17122e); border: 1.5px solid var(--acc); border-radius: 14px; padding: 12px; margin-bottom: 14px; }
    .master-head { display: flex; align-items: center; justify-content: space-between; font-weight: 700; margin-bottom: 8px; font-size: 13.5px; }

    /* Toast & Error Overlay */
    .toast { position: fixed; left: 50%; bottom: calc(125px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #1a162eee; border: 1px solid var(--acc); color: #fff; padding: 8px 16px; border-radius: 99px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 99; max-width: 90vw; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.6); }
    .toast.show { opacity: 1; }
    #err { display: none; place-items: center; position: fixed; inset: 0; z-index: 100; background: var(--bg); padding: 28px; text-align: center; color: var(--mut); font-weight: 700; }
    #err.show { display: grid; }

    /* Mensagens do programa no controle remoto */
    .h2-badge { font-size: 10px; padding: 1px 7px; border-radius: 99px; background: var(--panel2); color: var(--mut); font-weight: 800; }
    .rmsgs { display: flex; flex-direction: column; gap: 7px; margin-bottom: 12px; }
    .rmsg { display: flex; align-items: center; gap: 9px; width: 100%; padding: 10px; border-radius: 13px; border: 1.5px solid var(--line); background: var(--panel); text-align: left; }
    .rmsg.air { border-color: var(--pgm); background: #2b1220; }
    .rmsg-src { flex: none; align-self: flex-start; padding: 2px 7px; border-radius: 99px; background: var(--panel2); color: var(--mut); font-size: 9.5px; font-weight: 800; }
    .rmsg-src.wa { background: hsl(150 50% 30% / .35); color: #86efac; }
    .rmsg-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .rmsg-main b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rmsg-main small { color: var(--mut); font-size: 11.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .rmsg-tag { flex: none; padding: 3px 8px; border-radius: 99px; background: var(--panel2); color: var(--mut); font-size: 10px; font-weight: 800; }
    .rmsg.air .rmsg-tag { background: var(--pgm); color: #fff; }
    body.offline header { opacity: .82; }
    body.offline main { filter: saturate(.5); }
    .scene-bar { display: flex; gap: 7px; overflow-x: auto; padding: 2px 1px 8px; scrollbar-width: thin; }
    .scene-chip { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--panel); color: var(--txt); }
    .scene-chip b { font-size: 10px; color: var(--mut); }
    .scene-chip span { font-size: 12.5px; font-weight: 700; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .scene-chip.on { border-color: var(--acc); background: #241d4a; }
    .scene-chip.on b { color: #d8b4fe; }
    .btn.on { background: var(--acc); color: #fff; box-shadow: 0 0 10px #7c5cff55; }
    .send-row { flex-wrap: wrap; }
    .send-row .btn { padding: 3px 8px; border-radius: 8px; font-size: 10px; min-width: 0; }
    /* Reorganização 4 abas + Conteúdo segmentado */
    nav { grid-template-columns: repeat(5,1fr); }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; margin: 2px 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); }
    .seg button { position: relative; padding: 9px 8px; border-radius: 9px; background: transparent; color: var(--mut); font-size: 12px; font-weight: 800; }
    .seg button.active { background: var(--panel2); color: #fff; box-shadow: inset 0 0 0 1px var(--acc); }
    .badge-dot.in-seg { top: 6px; right: 8px; }
    .quick-audio { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
    .quick-audio .btn { flex: 1 1 140px; justify-content: center; }
    .conn-row { align-items: center; }
    .conn-row .dot { flex: none; }
    .shortcuts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); margin-bottom: 10px; }
    .shortcuts span { font-size: 12px; color: var(--mut); font-weight: 600; }
    .shortcuts b { display: inline-block; min-width: 30px; margin-right: 6px; padding: 2px 6px; border-radius: 6px; background: var(--panel2); color: var(--txt); font-size: 11px; text-align: center; }
    .tab h2:first-child { margin-top: 4px; }

    /* PC / tablet: usa a largura em vez de esticar um layout de celular */
    @media (min-width: 900px) {
      main { width: min(1040px, 100%); margin: 0 auto; padding-left: 20px; padding-right: 20px; }
      nav { left: 50%; right: auto; transform: translateX(-50%); width: min(700px, calc(100% - 24px)); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
      nav button { font-size: 12px; }
      .grid { grid-template-columns: repeat(4, 1fr); }
      .lay { grid-template-columns: repeat(4, 1fr); }
      .screen { max-height: 430px; }
      .screen img { object-fit: contain; }
      .mini-player { left: 50%; right: auto; transform: translateX(-50%); width: min(700px, calc(100% - 24px)); }
    }
    @media (min-width: 1200px) {
      .grid { grid-template-columns: repeat(5, 1fr); }
    }

    .tapcut-wrap { float: right; text-transform: none; letter-spacing: 0; font-size: 11px; color: var(--mut); font-weight: 600; }
    @media (min-width: 1000px) {
      .mesa-cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 20px; align-items: start; }
      .mesa-left { position: sticky; top: 8px; }
      .mesa-right .grid { grid-template-columns: repeat(2, 1fr); }
      .mesa-right .lay { grid-template-columns: repeat(3, 1fr); }
      #tab-audio, #tab-conteudo, #tab-mais { max-width: 820px; margin: 0 auto; }
    }
    @media (max-width: 999px) {
      .mesa-cols { display: block; }
    }


    /* Android horizontal: aproveita a largura e não deixa a prévia 16:9 estourar a altura */
    @media (orientation: landscape) and (max-height: 520px) {
      header { padding: 6px calc(10px + env(safe-area-inset-right)) 6px calc(10px + env(safe-area-inset-left)); gap: 6px; }
      header h1 { font-size: 14px; }
      header h1 small { display: none; }
      .hdr-actions { gap: 4px; }
      .iconbtn { width: 34px; height: 34px; border-radius: 10px; font-size: 15px; }
      main { padding: 8px calc(10px + env(safe-area-inset-right)) calc(66px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); }
      .mesa-cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 12px; align-items: start; }
      .mesa-left { position: static; }
      .mesa-right .grid { grid-template-columns: repeat(2, 1fr); }
      .mesa-right .lay { grid-template-columns: repeat(3, 1fr); }
      .screen { max-height: calc(100vh - 140px); }
      .bus { margin-top: 6px; }
      .trans { margin-top: 6px; }
      .trans button { height: 44px; font-size: 14px; }
      nav { padding: 4px 8px calc(4px + env(safe-area-inset-bottom)); }
      nav button { padding: 4px 0 3px; font-size: 10px; }
      nav button b { font-size: 16px; }
      .mini-player { bottom: calc(48px + env(safe-area-inset-bottom)); left: calc(8px + env(safe-area-inset-left)); right: calc(8px + env(safe-area-inset-right)); }
      .toast { bottom: calc(105px + env(safe-area-inset-bottom)); }
      .seg { margin-bottom: 8px; }
      .seg button { padding: 7px 8px; }
    }

    /* Notch/gesture bars em retrato também */
    @supports (padding: env(safe-area-inset-left)) {
      header { padding-left: calc(12px + env(safe-area-inset-left)); padding-right: calc(12px + env(safe-area-inset-right)); }
      main { padding-left: calc(12px + env(safe-area-inset-left)); padding-right: calc(12px + env(safe-area-inset-right)); }
    }

    /* Aba Replay */
    .rp-head { border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(180deg, #1a1630, #121021); padding: 12px; margin-bottom: 12px; }
    .rp-head.on-air { border-color: var(--pgm); box-shadow: 0 0 18px -6px #ef4444aa; }
    .rp-head-top { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
    .rp-head-top b { font-size: 14px; }
    .rp-head-top small { font-size: 11px; color: var(--mut); }
    .rp-badge { font: 800 10px var(--font); letter-spacing: .05em; padding: 4px 7px; border-radius: 6px; background: var(--panel2); color: var(--mut); }
    .rp-head.on-air .rp-badge { background: var(--pgm); color: #fff; }
    .rp-bar { height: 6px; border-radius: 4px; background: #241f3d; overflow: hidden; margin-top: 10px; }
    .rp-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--acc), var(--cyan)); transition: width .25s linear; }
    .rp-triggers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
    .rp-trig { padding: 12px 6px; border-radius: 14px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--panel2), var(--panel)); display: grid; gap: 2px; justify-items: center; }
    .rp-trig b { font-size: 17px; font-weight: 900; }
    .rp-trig small { font-size: 9.5px; color: var(--mut); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .rp-trig:active { transform: scale(.97); border-color: var(--pgm); }
    .rp-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
    .rp-controls .btn { justify-content: center; }
    .rp-speed { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .rp-speed .btn { justify-content: center; }
    @media (max-width: 370px) {
      .rp-triggers { grid-template-columns: repeat(2, 1fr); }
    }

    /* Ajustes Android (retrato/paisagem) */
    header h1 small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    header h1 { min-width: 0; }
    .badge-dot { top: 5px; right: 6px; }
    nav button { min-width: 0; }
    nav button b { margin-bottom: 1px; }
    .vol-bar, .vol-slider { min-width: 0; }
    .vol-slider { flex: 1; }
    .row { min-width: 0; }
    .row > span { min-width: 0; }
    .send-row { flex-wrap: wrap; row-gap: 5px; }
    .seg button { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rp-head-top { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
    .rp-head-top b { flex: 1 1 auto; min-width: 0; }
    .rp-triggers { gap: 7px; }
    .rp-controls, .rp-speed { gap: 7px; }
    .quick-audio { row-gap: 7px; }
    h2 { margin-top: 14px; }
    @media (orientation: landscape) and (max-height: 520px) {
      body.no-media main { padding-bottom: calc(54px + env(safe-area-inset-bottom)); }
      main { padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body class="no-media">
  <header>
    <i class="dot wait" id="dot"></i>
    <h1 id="title">Controle remoto<small id="sub">Conectando…</small></h1>
    <span class="badge rec" id="b-rec" hidden>REC</span>
    <span class="badge live" id="b-live" hidden>AO VIVO</span>
    <div class="hdr-actions">
      <button class="iconbtn" id="btn-audio" title="Monitorar áudio do programa (PGM)" aria-label="Monitorar áudio">🎧</button>
      <button class="iconbtn" id="btn-video" title="Mostrar vídeo do programa" aria-label="Alternar vídeo">📺</button>
      <button class="iconbtn" id="btn-fs" title="Tela cheia" aria-label="Tela cheia">⛶</button>
    </div>
  </header>

  <main>
    <section class="tab active" id="tab-mesa" aria-label="Mesa de corte"></section>
    <section class="tab" id="tab-audio" aria-label="Áudio"></section>
    <section class="tab" id="tab-replay" aria-label="Replay e buffer"></section>
    <section class="tab" id="tab-conteudo" aria-label="Conteúdo, GC e mensagens"></section>
    <section class="tab" id="tab-mais" aria-label="Mais e conexão"></section>
  </main>

  <!-- Player de Mídia fixo na parte de baixo estilo App de Música -->
  <div class="mini-player" id="mini-player" hidden>
    <div class="mp-bar" id="mp-bar" title="Avançar / Retroceder na mídia"><i class="mp-fill" id="mp-fill"></i></div>
    <div class="mp-main">
      <div class="mp-ico" id="mp-ico">🎵</div>
      <div class="mp-info" id="mp-info">
        <b id="mp-title">Mídia</b>
        <small id="mp-time">0:00 / 0:00</small>
      </div>
      <div class="mp-ctrls">
        <button class="mp-btn" id="mp-prev" title="Anterior" aria-label="Anterior">⏮</button>
        <button class="mp-btn mp-play" id="mp-play" title="Tocar / Pausar" aria-label="Play">▶</button>
        <button class="mp-btn" id="mp-next" title="Próxima" aria-label="Próxima">⏭</button>
        <button class="mp-btn mp-stage" id="mp-stage" title="Colocar / Tirar do palco">Palco</button>
      </div>
    </div>
  </div>

  <nav>
    <button data-tab="mesa" class="active"><b>🎛</b>Mesa</button>
    <button data-tab="audio"><b>🔊</b>Áudio</button>
    <button data-tab="replay"><b>⏪</b>Replay</button>
    <button data-tab="conteudo"><b>🗂</b>Conteúdo<span class="badge-dot" id="chat-dot" hidden></span></button>
    <button data-tab="mais"><b>⚙</b>Mais</button>
  </nav>

  <audio id="audio-pgm" autoplay playsinline hidden></audio>
  <div class="toast" id="toast"></div>
  <div id="err"><div id="err-msg"></div></div>
  <script type="module" src="/js/remote.js"></script>
</body>
</html>
