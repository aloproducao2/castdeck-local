<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="/icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a12">
  <meta name="robots" content="noindex">
  <title>Template Studio — CastDeck</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-0, #0a0a12); }
    body { font-family: Inter, system-ui, -apple-system, sans-serif; color: var(--text-0, #f3f0ff); }
    .tpl-window-host { width: 100%; height: 100%; }
    .modal-back { padding: 0 !important; background: var(--bg-0, #0a0a12) !important; backdrop-filter: none !important; }
    .modal.modal-screen { width: 100vw !important; height: 100vh !important; max-height: 100vh !important; }
  </style>
</head>
<body class="tpl-window-host">
  <noscript>Ative o JavaScript para editar templates.</noscript>
</body>
</html>
