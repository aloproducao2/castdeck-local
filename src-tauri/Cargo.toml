[package]
name = "castdeck-launcher"
version = "1.3.36"
description = "CastDeck Local - Lançador Desktop em Rust"
authors = ["Miguel Kallemback <miguel@flue.live>"]
license = "AGPL-3.0-only"
edition = "2021"


[build-dependencies]
winres = "0.1"

[features]
default = []
embedded-server = []

[dependencies]
tray-icon = "0.25"
muda = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell"
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
