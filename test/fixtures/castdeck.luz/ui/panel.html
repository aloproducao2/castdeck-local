<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luz — configuração</title>
  <style>
    :root { color-scheme: dark; --bg:#12141c; --bg2:#1a1d27; --line:#2a2f3d; --text:#eef0f6; --mut:#9aa1b2; --acc:#7c5cff; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px; font: 13px/1.5 Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: block; margin: 10px 0 4px; color: var(--mut); font-size: 12px; }
    input[type=text], input[type=password], input[type=number] {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--text);
    }
    .row { display: flex; gap: 8px; align-items: center; }
    button { margin-top: 14px; padding: 9px 14px; border-radius: 9px; border: 0; background: var(--acc); color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    button.secundario { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--line); }
    .hint { color: var(--mut); font-size: 11.5px; margin-top: 10px; }
    .ok { color: #5bd6a0; }
    .err { color: #ff8f8f; }
    code { color: #c9c2ff; }
  </style>
</head>
<body>
  <h1>Luz do convidado</h1>

  <label for="urlLigar">Endereço para LIGAR</label>
  <input id="urlLigar" type="text" placeholder="http://192.168.0.50/cm?cmnd=Power%20On">
  <label for="urlDesligar">Endereço para DESLIGAR</label>
  <input id="urlDesligar" type="text" placeholder="http://192.168.0.50/cm?cmnd=Power%20Off">

  <label for="token">Token (opcional)</label>
  <input id="token" type="password" autocomplete="off">

  <label><input id="aviso" type="checkbox"> Mostrar aviso na tela</label>
  <div class="row">
    <label for="segundos" style="margin:0;flex:1">Duração do aviso (s)</label>
    <input id="segundos" type="number" min="1" max="60" style="width:80px">
  </div>

  <button id="salvar">Salvar</button> <button id="testar" class="secundario">Testar agora</button>
  <p class="hint" id="status"></p>
  <p class="hint">
    Funciona com Tasmota, ESPHome e Home Assistant (webhook). O endereço precisa estar na lista de
    permissões do plugin (<code>network:</code>). Exemplo:
    <code>http://192.168.0.50/cm?cmnd=Power%20On</code>.
  </p>

  <script>
    // O painel roda isolado (sem acesso à API). Fala com o app por postMessage (ponte do CastDeck).
    const $ = (s) => document.querySelector(s);
    const pedidos = new Map();
    let seq = 0;
    window.addEventListener('message', (e) => {
      const d = e.data || {};
      if (d.type !== 'castdeck-plugin-resposta') return;
      const p = pedidos.get(d.id);
      if (!p) return;
      pedidos.delete(d.id);
      if (d.error) p.reject(new Error(d.error));
      else p.resolve(d.result);
    });
    function pedir(method, params = {}) {
      if (window.parent === window) return Promise.reject(new Error('painel fora do CastDeck'));
      const id = ++seq;
      return new Promise((resolve, reject) => {
        pedidos.set(id, { resolve, reject });
        window.parent.postMessage({ type: 'castdeck-plugin', id, method, params }, '*');
        setTimeout(() => {
          if (pedidos.has(id)) {
            pedidos.delete(id);
            reject(new Error('tempo esgotado'));
          }
        }, 8000);
      });
    }

    async function carregar() {
      try {
        const s = (await pedir('settings.get')) || {};
        $('#urlLigar').value = s.urlLigar || '';
        $('#urlDesligar').value = s.urlDesligar || '';
        $('#token').value = s.token || '';
        $('#aviso').checked = s.aviso !== false;
        $('#segundos').value = s.segundos || 6;
      } catch (e) {
        $('#status').textContent = 'Não foi possível carregar: ' + e.message;
        $('#status').className = 'hint err';
      }
    }

    $('#salvar').onclick = async () => {
      $('#salvar').disabled = true;
      $('#status').textContent = 'Salvando…';
      $('#status').className = 'hint';
      try {
        await pedir('settings.save', {
          urlLigar: $('#urlLigar').value.trim(),
          urlDesligar: $('#urlDesligar').value.trim(),
          token: $('#token').value,
          aviso: $('#aviso').checked,
          segundos: Number($('#segundos').value) || 6,
        });
        $('#status').textContent = 'Salvo — as próximas entradas no palco já usam esta configuração.';
        $('#status').className = 'hint ok';
      } catch (e) {
        $('#status').textContent = 'Falha ao salvar: ' + e.message;
        $('#status').className = 'hint err';
      }
      $('#salvar').disabled = false;
    };

    document.getElementById('testar').onclick = async () => {
      const st = document.getElementById('status');
      st.textContent = 'Testando…';
      st.className = 'hint';
      try {
        const r = await pedir('test');
        const acoes = (r?.acoes || []).map((a) => a.acao).join(', ');
        st.textContent = r?.ok ? 'Funcionou: ' + acoes : 'Nada aconteceu — ' + (r?.dica || 'confira os endereços salvos');
        st.className = 'hint ' + (r?.ok ? 'ok' : 'err');
      } catch (e) {
        st.textContent = 'Falha no teste: ' + e.message;
        st.className = 'hint err';
      }
    };

    carregar();
  </script>
</body>
</html>
